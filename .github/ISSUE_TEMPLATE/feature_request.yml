name: Đề xuất tính năng
description: Đề xuất entity, setting hoặc khả năng mới
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: use_case
    attributes:
      label: Nhu cầu
      description: Mô tả tình huống sử dụng thay vì chỉ nêu tên command.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Giải pháp đề xuất
    validations:
      required: true
  - type: dropdown
    id: evidence
    attributes:
      label: Bằng chứng API
      options:
        - Có trong APK và đã thử không phá hủy
        - Có trong APK nhưng chưa thử
        - Suy đoán/chưa có bằng chứng
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: An toàn
      options:
        - label: Tính năng không yêu cầu factory reset hoặc công khai credential.
          required: true

